<<: !include base_diffusion.yaml
<<: !include envs/pusht_coverTee.yaml

job_name: train_diffusion_pusht_partial
dataset:
  repo_id: the-future-dev/pusht_image_keypoints
  image_transforms:
    enable: true
    tfs:
      CoverGreenT:
        weight: 1.0
        type: CoverGreenT
policy:
  repo_id: OliverHausdoerfer/diffusion_pusht_v1
  type: diffusion
  optimizer_lr: 0.0002
  partial_green_t_cover_processor: true
  input_features:
    observation.state:
      type: STATE
      shape:
        - 2
    observation.environment_state:
      type: ENV
      shape:
        - 16
    observation.image:
      type: VISUAL
      shape:
        - 3
        - 96
        - 96

