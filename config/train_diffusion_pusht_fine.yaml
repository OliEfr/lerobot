env:
  type: pusht
  visualization_width: 224
  visualization_height: 224
  observation_width: 512
  observation_height: 512
  obs_type: environment_state_agent_pos_pixels
  features:
    action:
      type: ACTION
      shape:
        - 2
    agent_pos:
      type: STATE
      shape:
        - 2
    pixels:
      type: VISUAL
      shape:
        - 3
        - 512
        - 512
    environment_state:
      type: ENV
      shape:
        - 16
  coarsity: fine
job_name: pusht_diffusion_fine
steps: 100_000
save_freq: 150_000
eval_freq: 10_000
log_freq: 500
batch_size: 128
dataset:
  repo_id: EXP_pusht_teleop_Y2025_M12_D02_H13_M56_S10_fine
  root: pusht_teleop_data/EXP_pusht_teleop_Y2025_M12_D02_H13_M56_S10_fine
  image_transforms:
    enable: false
wandb:
  enable: true
  project: policies
rename_map: # Hack: this needs to be set in order to pass validate_visual_features_consistency when not having image inputs.
  dummy: dummy
policy:
  repo_id: OliverHausdoerfer/diffusion_pusht_v1
  type: diffusion
  optimizer_lr: 0.0002
  input_features:
    observation.state:
      type: STATE
      shape:
        - 2
    observation.environment_state:
      type: ENV
      shape:
        - 16
  use_separate_rgb_encoder_per_camera: true
  crop_shape: [212, 212]