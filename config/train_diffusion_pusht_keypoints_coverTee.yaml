<<: !include train_diffusion_pusht_keypoints.yaml

job_name: train_diffusion_pusht_keypoints_coverTee
env:
  type: pusht
  visualization_width: 96
  visualization_height: 96
  obs_type: environment_state_agent_pos
  features:
    action:
      type: ACTION
      shape:
        - 2
    agent_pos:
      type: STATE
      shape:
        - 2
    environment_state:
      type: ENV
      shape:
        - 16
  CoverGreenT: true
dataset:
  repo_id: the-future-dev/pusht_image_keypoints
  image_transforms:
    enable: true
    tfs:
      CoverGreenT:
        weight: 1.0
        type: CoverGreenT
